<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vakit">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C111D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.VAKIT_STANDALONE=true;try{var vt=JSON.parse(localStorage.getItem("vakit.theme"));if(vt==="light"||vt==="dark")document.documentElement.setAttribute("data-theme",vt)}catch(e){}</script>
<title>Vakit Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap">
</head>
<body>
<style>
/* Layout: one narrow column like a phone app. Ring first, then the day's times, then kerahat, night, place and settings. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --fg:#172033; --muted:#5D6880; --line:#D7DDE7;
  --accent:#12706B; --accent-soft:#DCEFEC;
  --kerahat:#D3362B; --kerahat-soft:#FBE3E1;
  --makruh:#E0821F; --makruh-soft:#FCEBD7;
  --third:#2F45A8; --third-soft:#E1E6F8;
  --p-fajr:#B7C5E6; --p-duha:#E6EAF0; --p-dhuhr:#A6D8CC; --p-asr:#73B8A8; --p-maghrib:#4A8C89; --p-isha:#2D4E63; --p-night:#C9D1E3; --p-current:#0E7A72;
  --kz-ok:#1E8A4C; --kz-ok-soft:#D5F0DE; --kz-part:#B07F00; --kz-part-soft:#FBEDBF; --kz-open:#C9372C; --kz-open-soft:#FADDDA;
  --font-display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-ar:"Amiri","Geeza Pro","Times New Roman",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111D; --surface:#151C2C; --surface-2:#1B2336; --fg:#E7EBF3; --muted:#97A2B9; --line:#28324A;
  --accent:#4FC2B3; --accent-soft:#16312F;
  --kerahat:#FF5B4F; --kerahat-soft:#3A1A1B;
  --makruh:#F4A04A; --makruh-soft:#3A2814;
  --third:#8395FA; --third-soft:#1E2550;
  --p-fajr:#3A4F86; --p-duha:#273047; --p-dhuhr:#2F8577; --p-asr:#276E63; --p-maghrib:#205955; --p-isha:#173A4C; --p-night:#3A4772; --p-current:#5FD6C6;
  --kz-ok:#4CC77E; --kz-ok-soft:#163A25; --kz-part:#E9B93C; --kz-part-soft:#3A3013; --kz-open:#FF6B5F; --kz-open-soft:#3F1C1C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111D; --surface:#151C2C; --surface-2:#1B2336; --fg:#E7EBF3; --muted:#97A2B9; --line:#28324A;
  --accent:#4FC2B3; --accent-soft:#16312F;
  --kerahat:#FF5B4F; --kerahat-soft:#3A1A1B;
  --makruh:#F4A04A; --makruh-soft:#3A2814;
  --third:#8395FA; --third-soft:#1E2550;
  --p-fajr:#3A4F86; --p-duha:#273047; --p-dhuhr:#2F8577; --p-asr:#276E63; --p-maghrib:#205955; --p-isha:#173A4C; --p-night:#3A4772; --p-current:#5FD6C6;
  --kz-ok:#4CC77E; --kz-ok-soft:#163A25; --kz-part:#E9B93C; --kz-part-soft:#3A3013; --kz-open:#FF6B5F; --kz-open-soft:#3F1C1C;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.place{display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 10px}
.place svg{flex:none;color:var(--accent)}
.place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* date */
.date{display:flex;align-items:center;gap:8px}
.date .nav{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.date .mid{flex:1;min-width:0;text-align:center}
.date h1{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.date .hijri{color:var(--muted);font-size:13.5px}
.today-btn{margin-top:4px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:999px}

/* ring */
.ringwrap{background:var(--surface);border-radius:var(--r);padding:6px 2px 12px;border:1px solid var(--line)}
#ring{display:block;width:100%;max-width:480px;height:auto;margin:0 auto}
#ring text{font-family:var(--font-body)}
#ring .tick{stroke:var(--muted);stroke-width:1;opacity:.5}
#ring .tick.major{opacity:.85;stroke-width:1.4}
#ring .seg{stroke:var(--surface);stroke-width:1}
#ring .cur{fill:var(--p-current)}
#ring .sep{stroke:var(--surface);stroke-width:2.2}
#ring .ker{fill:var(--kerahat)}
#ring .mkarc{fill:var(--makruh)}
#ring .pname{fill:var(--fg);font-size:13px;font-weight:600}
#ring .ptime{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
#ring .sun-p{fill:var(--muted);font-weight:500}
#ring .now-p{fill:var(--p-current);font-weight:700}
#ring .pname.now-p{font-size:14.5px}
#ring .ptime.now-p{font-size:13px}
#ring .nightband{fill:var(--p-night)}
#ring .third{fill:var(--third)}
#ring .thirdtick{stroke:var(--fg);stroke-width:1.6}
#ring .thirdlabel{fill:var(--third);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
#ring .midline{stroke:var(--makruh);stroke-width:2.4;stroke-linecap:round}
#ring .midname{fill:var(--muted);font-size:10.5px}
#ring .midtime{fill:var(--makruh);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
#ring .now{stroke:var(--fg);stroke-width:2.4;stroke-linecap:round}
#ring .nowhalo{stroke:var(--surface);stroke-width:5.5;stroke-linecap:round}
#ring .nowdot{fill:var(--fg)}
#ring .nowring{fill:var(--surface);stroke:var(--fg);stroke-width:2}
#ring .c-small{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
#ring .c-name{fill:var(--fg);font-size:21px;font-family:var(--font-display)}
#ring .c-count{fill:var(--fg);font-size:27px;font-weight:600;font-family:var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.5px}
#ring .c-state{font-size:11.5px;font-weight:700;letter-spacing:.4px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.sw.k{background:var(--kerahat)}
.sw.m{background:var(--makruh);height:4px;border-radius:2px}
.sw.t{background:var(--third)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0;padding:13px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-family:var(--font-body);font-size:12px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0 0 6px}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ar{font-family:var(--font-ar);font-size:19px;width:66px;text-align:center;color:var(--accent);line-height:1}
.row .nm{min-width:0}
.row .nm b{display:block;font-weight:600}
.row .nm span{display:block;font-size:12.5px;color:var(--muted)}
.row .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:19px}
.row.cur{background:var(--accent-soft)}
.row.cur .tm{color:var(--accent)}
.row.next .nm b::after{content:attr(data-next);margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px;vertical-align:1px}
.row.sunrow .tm{color:var(--muted);font-weight:500}
.mark{width:10px;height:28px;border-radius:4px}
.row.k .mark{background:var(--kerahat)}
.row.k .tm{font-size:16px}
.row.k.active{background:var(--kerahat-soft)}
.row.n .tm{font-size:17px}
.row.n .mark.mid{background:repeating-linear-gradient(135deg,var(--makruh) 0 2px,transparent 2px 5px);border:1px solid var(--makruh)}
.row.n .mark.th{background:var(--third)}
.row.n .mark.t1{background:var(--p-night)}
.row.n .mark.len{background:transparent;border:1px dashed var(--muted)}
.row.n.active{background:var(--third-soft)}
.row.n.activem{background:var(--makruh-soft)}
.fb{font-size:11px;color:var(--makruh);font-weight:700}

/* settings */
.set{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}
.set label{min-width:0;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.set select,.set input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:13px;color:var(--muted);margin:0}
.msg.err{color:var(--kerahat)}
.meta{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.meta b{color:var(--fg);font-weight:600}
.foot{text-align:center;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:14px}
.golist{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;font-weight:600;text-align:left}
.golist small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.golist svg{flex:none;color:var(--accent)}
.lhead{display:flex;align-items:center;gap:10px}
.lhead h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;line-height:1.2}
.lhead p{margin:0;font-size:13px;color:var(--muted)}
.sum{padding:2px 16px 14px;font-size:14px;margin:0}
.sum b{font-weight:600}
#lenChart{display:block;width:100%;height:auto}
#lenChart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
#lenChart .grid{stroke:var(--line);stroke-width:1}
#lenChart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
#lenChart .area{fill:var(--accent-soft)}
#lenChart .end{fill:var(--accent)}
#lenChart .endlab{fill:var(--fg);font-size:11px;font-weight:600;font-family:var(--font-body)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl th{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding:8px 2px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:8px}
.tbl th:last-child,.tbl td:last-child{padding-right:8px;text-align:right}
.tbl td{text-align:center;padding:7px 2px;border-top:1px solid var(--line);white-space:nowrap}
.tbl td.d b{display:block;font-weight:600}
.tbl td.d span{display:block;font-size:10.5px;color:var(--muted);max-width:72px;overflow:hidden;text-overflow:ellipsis}
.tbl td.sun{color:var(--muted)}
.tbl td.len b{display:block;font-weight:600}
.tbl td.len span{display:block;font-size:11px;font-weight:600}
.dn{color:var(--kerahat)} .up{color:var(--accent)}
.tbl tr.fri td{background:var(--surface-2)}
.tbl tr.today td{background:var(--accent-soft)}
.tbl tr.mon td{background:transparent;font-family:var(--font-display);font-size:15px;text-align:left;padding:14px 12px 6px;border-top:0;color:var(--fg)}
.top .lang{margin-left:auto}

/* kaza */
.kz-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 10px}
.kz-num b{display:block;font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kz-num span{font-size:12.5px;color:var(--muted)}
.kz-num.ok b{color:var(--kz-ok)} .kz-num.op b{color:var(--kz-open)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--kz-ok)}
.kz-barwrap{padding:0 16px 4px}
.kz-years{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;padding:12px 16px 12px}
.kz-yr{display:grid;grid-template-columns:34px 1fr 38px;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums}
.kz-yr .bar{height:6px}
.kz-yr em{font-style:normal;text-align:right;color:var(--muted)}
.kz-proj{margin:0;padding:11px 16px 13px;border-top:1px solid var(--line);font-size:13.5px}
.kz-proj b{font-weight:600}
.kz-proj small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:2px}
.kz-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 10px 10px}
.kz-step{display:flex;align-items:center;gap:4px}
.kz-step button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.kz-step button:disabled{opacity:.3;cursor:default}
.kz-step b{text-align:center;font-weight:600;font-size:15.5px}
#kzY{min-width:44px} #kzM{min-width:86px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 10px 4px}
.cal .wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 3px}
.cal .day{aspect-ratio:1/1;min-height:40px;border-radius:10px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:0;color:var(--fg)}
.cal .s0{background:var(--kz-open-soft);border-color:var(--kz-open)}
.cal .s1{background:var(--kz-part-soft);border-color:var(--kz-part)}
.cal .s2{background:var(--kz-ok-soft);border-color:var(--kz-ok)}
.cal .dots{display:flex;gap:2px;line-height:0}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--fg);opacity:.18}
.cal .dots i.on{opacity:.85}
.sw.ok{background:var(--kz-ok)} .sw.pa{background:var(--kz-part)} .sw.op{background:var(--kz-open)}
.kz-legend{padding:6px 10px 14px;margin:0}
.kz-warn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--makruh-soft);border:1px solid var(--makruh);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.kz-warn b{display:block;font-weight:600}
.kz-warn span{color:var(--muted);font-size:12.5px}
.kz-warn .btn{flex:none}
.kz-err{background:var(--kerahat-soft);border:1px solid var(--kerahat);border-radius:var(--r);padding:12px 14px}
.kz-prev{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.kz-prev b{font-weight:600}
.kz-prev p{margin:0}
.kz-file{position:fixed;left:0;top:0;width:1px;height:1px;max-width:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,22,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:sheetUp .2s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:21px;margin:0;line-height:1.25}
.sheet .shsub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 12px}
.tg button{min-height:66px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-weight:600;font-size:17px;text-align:left}
.tg button[aria-checked="true"]{background:var(--kz-ok-soft);border-color:var(--kz-ok)}
.tg .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.tg button[aria-checked="true"] .ck{background:var(--kz-ok);border-color:var(--kz-ok);color:var(--surface)}
.tg button:disabled{opacity:.5}
.sheet .acts{display:flex;flex-direction:column;gap:8px}
.sheet .acts .btn{padding:13px 12px;font-size:15px}
.row[data-k]{cursor:pointer;grid-template-columns:auto 1fr auto auto}
.row[data-k] .chev{color:var(--muted);display:grid;place-items:center;margin-left:-4px}
.row[data-k]:active{background:var(--surface-2)}
.g-sheet{max-height:86vh;display:flex;flex-direction:column}
#gBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 -4px;padding:0 4px 4px}
.g-headrow{display:flex;align-items:center;gap:12px}
.g-ar{font-family:var(--font-ar);font-size:30px;color:var(--accent);line-height:1;flex:none}
.g-hd{min-width:0}
.g-tm{font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.g-sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 4px}
.g-dot{color:var(--muted)}
.g-chip,.g-badge{display:inline-block;border-radius:999px;font-weight:700;font-size:12.5px;padding:3px 10px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.g-fard{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.g-wajib{background:var(--third-soft);color:var(--third);border-color:var(--third)}

let lang=store.get("lang","de"); if(!T[lang]) lang="de";
let hijriOff=+store.get("hijriOff",0)||0;

function applyTheme(){

const KEYS=["fajr","shuruq","dhuhr","asr","maghrib","isha"];
const NAME={fajr:"Fajr",shuruq:"Shuruq",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha"};
const nm=k=>lang==="tr"?T.tr.name[k]:NAME[k];
const AR={fajr:"الفجر",shuruq:"الشروق",dhuhr:"الظهر",asr:"العصر",maghrib:"المغرب",isha:"العشاء"};

/* ---------- astronomy (PrayTimes.org algorithm, one pass) ---------- */
const RAD=Math.PI/180, DEG=180/Math.PI;
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function rawTimes(lat,lon,y,mo,d,tz){
  const jd=julian(y,mo,d)-lon/360;
  const sun=t=>{const D=jd+t-2451545,g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360,
    L=(q+1.915*Math.sin(g*RAD)+0.020*Math.sin(2*g*RAD))%360,e=23.439-0.00000036*D;
    const RA=((Math.atan2(Math.cos(e*RAD)*Math.sin(L*RAD),Math.cos(L*RAD))*DEG)/15+24)%24;
    let eq=q/15-RA; eq=((eq%24)+24+12)%24-12;
    return {dec:Math.asin(Math.sin(e*RAD)*Math.sin(L*RAD))*DEG,eq}};
  const noon=t=>((12-sun(t).eq)%24+24)%24;
  const sunAngle=(ang,t,ccw)=>{const s=sun(t),n=noon(t);
    const c=(-Math.sin(ang*RAD)-Math.sin(s.dec*RAD)*Math.sin(lat*RAD))/(Math.cos(s.dec*RAD)*Math.cos(lat*RAD));
    if(c<-1||c>1) return NaN; const h=Math.acos(c)*DEG/15; return n+(ccw?-h:h)};
  const asr=(f,t)=>{const s=sun(t);return sunAngle(-Math.atan(1/(f+Math.tan(Math.abs(lat-s.dec)*RAD)))*DEG,t,false)};
  const g={f:5/24,s:6/24,d:12/24,a:13/24,m:18/24,i:18/24};
  const r={fajr:sunAngle(METHOD.fajr,g.f,true),shuruq:sunAngle(0.833,g.s,true),dhuhr:noon(g.d),
           asr:asr(METHOD.asrFactor,g.a),maghrib:sunAngle(0.833,g.m,false),isha:sunAngle(METHOD.isha,g.i,false)};
  const fallback={};
  // fallback only where the sun never reaches the angle (far north in summer): angle-based portion of the night
  const night=(r.shuruq-r.maghrib+24)%24;
  if(isNaN(r.fajr)&&!isNaN(r.shuruq)){r.fajr=r.shuruq-METHOD.fajr/60*night;fallback.fajr=true}
  if(isNaN(r.isha)&&!isNaN(r.maghrib)){r.isha=r.maghrib+METHOD.isha/60*night;fallback.isha=true}
  const out={};
  for(const k of KEYS){const h=r[k]+tz-lon/15;out[k]=Math.round(h*60+OFFSETS[k])}
  out.fallback=fallback;
  return out;
}

/* ---------- time zone helpers ---------- */
function partsIn(tz,date){
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
  const p={};for(const x of f.formatToParts(date)) p[x.type]=x.value;
  return {y:+p.year,m:+p.month,d:+p.day,H:+p.hour%24,M:+p.minute,S:+p.second};
}
function tzOffsetHours(tz,y,m,d){
  const utc=Date.UTC(y,m-1,d,12,0,0);const p=partsIn(tz,new Date(utc));
  return (Date.UTC(p.y,p.m-1,p.d,p.H,p.M,p.S)-utc)/3600000;
}
function addDays(o,n){const t=new Date(Date.UTC(o.y,o.m-1,o.d+n));return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}}
function sameDay(a,b){return a.y===b.y&&a.m===b.m&&a.d===b.d}
function timesFor(day){return rawTimes(place.lat,place.lon,day.y,day.m,day.d,tzOffsetHours(place.tz,day.y,day.m,day.d))}
const fmt=m=>{if(m==null||isNaN(m))return "––:––";m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const fmtDur=m=>{m=Math.round(m);return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"};

/* ---------- derived: kerahat and night ---------- */
function derive(day){
  const t=timesFor(day), tn=timesFor(addDays(day,1)), tp=timesFor(addDays(day,-1));
  const ker=[[t.shuruq,t.shuruq+KERAHAT_MIN],[t.dhuhr-KERAHAT_MIN,t.dhuhr],[t.maghrib-KERAHAT_MIN,t.maghrib]];
  const mkNight=(start,end)=>{const L=end-start;return {start,end,len:L,mid:Math.round(start+L/2),t1:Math.round(start+L/3),t2:Math.round(start+2*L/3)}};
  const tonight=mkNight(t.maghrib,tn.fajr+1440);      // this evening → tomorrow's Fajr
  const lastNight=mkNight(tp.maghrib-1440,t.fajr);    // yesterday evening → this morning's Fajr
  return {t,tn,ker,tonight,lastNight};
}

/* ---------- ring drawing ---------- */
const SVGNS="http://www.w3.org/2000/svg", C=240;
// ring radii: outer prayer ring, current-prayer bulge, night band inside, hour ticks and labels outside
const R={outO:154,outI:122,bulge:9,nO:110,nI:98,tickI:162,tickO:166,tickMaj:170,lab:178};
const ang=m=>((m/1440)*360+180)*RAD;                 // 12:00 at the top, 00:00 at the bottom, clockwise
const pt=(r,m)=>[C+r*Math.sin(ang(m)),C-r*Math.cos(ang(m))];
function sector(r1,r2,m1,m2){
  m1=Math.max(0,m1);m2=Math.min(1440,m2);if(!(m2>m1))return "";
  if(m2-m1>=1439.9){m2=m1+1439.9}
  const large=(m2-m1)>720?1:0,[a,b]=pt(r2,m1),[c,d]=pt(r2,m2),[e,f]=pt(r1,m2),[g,h]=pt(r1,m1);
  return `M${a.toFixed(2)} ${b.toFixed(2)}A${r2} ${r2} 0 ${large} 1 ${c.toFixed(2)} ${d.toFixed(2)}L${e.toFixed(2)} ${f.toFixed(2)}A${r1} ${r1} 0 ${large} 0 ${g.toFixed(2)} ${h.toFixed(2)}Z`;
}
function el(tag,attrs,parent,text){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
let centerRefs=null, nowRefs=null, ringCur=null;

// prayer period the clock is in (null between Shuruq and Dhuhr)
function curPrayer(t,m){
  if(m<t.fajr)return "isha";if(m<t.shuruq)return "fajr";if(m<t.dhuhr)return null;
  if(m<t.asr)return "dhuhr";if(m<t.maghrib)return "asr";if(m<t.isha)return "maghrib";return "isha";
}
function currentKey(){const n=nowMin();return D&&sameDay(n.day,viewDay)?curPrayer(D.t,n.min):null}

// two-line label just outside the ring; anchored by side: right → start, left → end, top/bottom → middle
function outLabel(parent,m,r,lines){
  const a=ang(m),sx=Math.sin(a),sy=-Math.cos(a),[x,y]=pt(r,m);
  const g=el("g",{},parent),side=Math.abs(sx)>0.5,lh=14;
  const anchor=side?(sx>0?"start":"end"):"middle";
  const top=side?y-lh/2-1:(sy<0?y-lh*lines.length+8:y+10); // baseline of the first line
  lines.forEach(([txt,cls],i)=>el("text",{x:x+(side?(sx>0?2:-2):0),y:top+i*lh,"text-anchor":anchor,class:cls},g,txt));
  return g;
}
const boxHit=(a,b)=>a.width&&b.width&&a.x<b.x+b.width&&b.x<a.x+a.width&&a.y<b.y+b.height&&b.y<a.y+a.height;

function drawRing(day,D){
  const s=document.getElementById("ring");s.innerHTML="";
  const t=D.t,cur=currentKey();ringCur=cur;
  const L=T[lang];
  // periods (the running one is drawn later, thicker)
  const per=[[0,t.fajr,"--p-isha","isha"],[t.fajr,t.shuruq,"--p-fajr","fajr"],[t.shuruq,t.dhuhr,"--p-duha",null],[t.dhuhr,t.asr,"--p-dhuhr","dhuhr"],
             [t.asr,t.maghrib,"--p-asr","asr"],[t.maghrib,t.isha,"--p-maghrib","maghrib"],[t.isha,1440,"--p-isha","isha"]];
  const curArcs=cur?per.filter(p=>p[3]===cur).map(p=>[p[0],p[1]]):[];
  for(const [a,b,v,k] of per){if(cur&&k===cur)continue;const d=sector(R.outI,R.outO,a,b);if(d)el("path",{d,class:"seg",style:`fill:var(${v})`},s)}
  for(const [a,b] of curArcs){const d=sector(R.outI-R.bulge,R.outO+R.bulge,a,b);if(d)el("path",{d,class:"cur"},s)}
  // kerahat, same width as the normal ring
  for(const [a,b] of D.ker){const d=sector(R.outI,R.outO,a,b);if(d)el("path",{d,class:"ker"},s)}
  // separators at each prayer start
  const inCur=m=>curArcs.some(([a,b])=>m>=a-0.5&&m<=b+0.5);
  for(const k of KEYS){const m=t[k];if(isNaN(m))continue;const ext=inCur(m)?R.bulge+1:1;
    const [x1,y1]=pt(R.outI-ext,m),[x2,y2]=pt(R.outO+ext,m);el("line",{x1,y1,x2,y2,class:"sep"},s)}
  // isha makruh: thin orange arc just outside the ring, islamic midnight → Fajr
  const curIsha=cur==="isha", mkR=R.outO+(curIsha?R.bulge:0)+2;
  for(const n of [D.lastNight,D.tonight]){const d=sector(mkR,mkR+3,n.mid,n.end);if(d)el("path",{d,class:"mkarc"},s)}
  // hour ticks, longer every 6 hours; none inside the running prayer's section
  for(let h=0;h<24;h++){const m=h*60;if(inCur(m))continue;const major=h%6===0;
    const [x1,y1]=pt(R.tickI,m),[x2,y2]=pt(major?R.tickMaj:R.tickO,m);el("line",{x1,y1,x2,y2,class:"tick"+(major?" major":"")},s)}
  // night band: only the start of the last third is marked
  const marks=[];
  for(const n of [D.lastNight,D.tonight]){
    const d1=sector(R.nI,R.nO,n.start,n.end);if(d1)el("path",{d:d1,class:"nightband"},s);
    const d2=sector(R.nI,R.nO,n.t2,n.end);if(d2)el("path",{d:d2,class:"third"},s);
    if(n.t2>0&&n.t2<1440){const [x1,y1]=pt(R.nI-3,n.t2),[x2,y2]=pt(R.nO+3,n.t2);el("line",{x1,y1,x2,y2,class:"thirdtick"},s);
      const [lx,ly]=pt(R.nI-14,n.t2);el("text",{x:lx,y:ly+3.5,"text-anchor":"middle",class:"thirdlabel"},s,fmt(n.t2))}
    if(n.mid>0&&n.mid<1440)marks.push(n.mid);
  }
  // prayer names and times outside
  const labs=[];
  for(const k of KEYS){const m=t[k];if(isNaN(m))continue;
    const c=k===cur?" now-p":k==="shuruq"?" sun-p":"";
    const r=R.lab+(k===cur?R.bulge-4:0);
    labs.push(outLabel(s,m,r,[[nm(k),"pname"+c],[fmt(m),"ptime"+c]]))}
  // islamic midnight: line through the ring, label outside (moved further out if it would touch a prayer label)
  for(const m of marks){
    const outer=mkR+5,[x1,y1]=pt(R.nI-2,m),[x2,y2]=pt(outer,m);el("line",{x1,y1,x2,y2,class:"midline"},s);
    let g=null;
    for(let step=0;step<4;step++){
      if(g)g.remove();
      g=outLabel(s,m,R.lab+(curIsha?R.bulge-4:0)+step*14,[[L.midnight,"midname"],[fmt(m),"midtime"]]);
      let bb;try{bb=g.getBBox()}catch(e){break}
      if(!labs.some(l=>{try{return boxHit(bb,l.getBBox())}catch(e){return false}}))break;
    }
  }
  // now pointer (only for today): short stroke across the ring with a small circle outside
  const g=el("g",{id:"nowG"},s);
  const halo=el("line",{class:"nowhalo"},g), ln=el("line",{class:"now"},g), dot=el("circle",{r:"5",class:"nowring"},g);
  nowRefs={g,halo,ln,dot};
  // center
  const cs=el("text",{x:C,y:C-34,"text-anchor":"middle",class:"c-small"},s);
  const cn=el("text",{x:C,y:C-8,"text-anchor":"middle",class:"c-name"},s);
  const cc=el("text",{x:C,y:C+24,"text-anchor":"middle",class:"c-count"},s);
  const st=el("text",{x:C,y:C+46,"text-anchor":"middle",class:"c-state"},s);
  const st2=el("text",{x:C,y:C+61,"text-anchor":"middle",class:"c-state"},s);
  centerRefs={cs,cn,cc,st,st2};
}

/* ---------- lists ---------- */
function rows(D){
  const L=T[lang],t=D.t;
  const pr=document.getElementById("prayerRows");pr.innerHTML="";
  for(const k of KEYS){
    const li=document.createElement("li");li.className="row"+(k==="shuruq"?" sunrow":"");li.dataset.k=k;
    const fb=t.fallback[k]?' <span class="fb">*</span>':"";
    li.innerHTML=`<span class="ar" lang="ar">${AR[k]}</span><span class="nm"><b data-next="${L.next}">${nm(k)}</b>${lang==="tr"?"":`<span>${L.sub[k]}</span>`}</span><span class="tm">${fmt(t[k])}${fb}</span><span class="chev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>`;
    li.tabIndex=0;li.setAttribute("role","button");
    pr.appendChild(li);
  }
  if(t.fallback.fajr||t.fallback.isha){const li=document.createElement("li");li.className="row";li.innerHTML=`<span></span><span class="nm"><span>${L.fb}</span></span><span></span>`;pr.appendChild(li)}
  const kr=document.getElementById("kerRows");kr.innerHTML="";
  D.ker.forEach(([a,b],i)=>{const li=document.createElement("li");li.className="row k";li.dataset.a=a;li.dataset.b=b;
    li.innerHTML=`<span class="mark"></span><span class="nm"><b>${L.ker[i]}</b><span>${L.kerSub[i]}</span></span><span class="tm">${fmt(a)} – ${fmt(b)}</span>`;kr.appendChild(li)});
  const nr=document.getElementById("nightRows");nr.innerHTML="";
  const n=D.tonight;
  const items=[["mid",n.mid],["t1",n.t1],["th",n.t2],["len",null]];
  items.forEach(([cls,v],i)=>{const li=document.createElement("li");li.className="row n";li.dataset.kind=cls;
    const val=cls==="len"?fmtDur(n.len):fmt(v);
    const sub=cls==="len"?`${fmt(n.start)} – ${fmt(n.end)}`:L.nightSubs[i];
    li.innerHTML=`<span class="mark ${cls}"></span><span class="nm"><b>${L.nightRows[i]}</b>${sub?`<span>${sub}</span>`:""}</span><span class="tm">${val}</span>`;nr.appendChild(li)});
}

/* ---------- state + render ---------- */
let viewDay=null, D=null;
function todayInPlace(){const p=partsIn(place.tz,new Date());return {y:p.y,m:p.m,d:p.d}}
function nowMin(){const p=partsIn(place.tz,new Date());return {day:{y:p.y,m:p.m,d:p.d},min:p.H*60+p.M+p.S/60}}

function hijriText(day){
  const L=T[lang];const base=new Date(Date.UTC(day.y,day.m-1,day.d+hijriOff,12));
  for(const ca of ["islamic-umalqura","islamic"]){
    try{const f=new Intl.DateTimeFormat("en-u-ca-"+ca+"-nu-latn",{day:"numeric",month:"numeric",year:"numeric",timeZone:"UTC"});
      const p={};for(const x of f.formatToParts(base))p[x.type]=x.value;
      if(f.resolvedOptions().calendar.indexOf("islamic")===0&&p.month){return `${parseInt(p.day,10)}. ${L.hm[parseInt(p.month,10)-1]} ${parseInt(p.year,10)}`.replace(/^(\d+)\. /,lang==="tr"?"$1 ":"$1. ")}
    }catch(e){}
  }
  return "";
}

function render(){
  const L=T[lang];
  document.documentElement.lang=lang;
  document.getElementById("langDe").setAttribute("aria-pressed",String(lang==="de"));
  document.getElementById("langTr").setAttribute("aria-pressed",String(lang==="tr"));
  const txt={hPrayers:L.prayers,hPrayersSub:L.prayersSub,hKerahat:L.kerahat,hKerahatSub:L.kerahatSub,hNight:L.night,hNightSub:L.nightSub,
    hPlace:L.place,hSettings:L.settings,lgK:L.legK,lgM:L.legM,lgT:L.legT,gpsBtn:L.gps,lCity:L.city,lHijri:L.hijri,todayBtn:L.today,goListT:L.goListT,goListS:L.goListS,lTitle:L.lTitle,hLen:L.lenH,hLenSub:L.lenSub};
  for(const id in txt)document.getElementById(id).textContent=txt[id];
  document.getElementById("methodMeta").innerHTML=L.method(OFFSETS);
  document.getElementById("placeName").textContent=place.src==="gps"?`${L.myPlace}${place.near?" · "+place.near:""}`:place.src==="manual"?L.manual:place.name;
  document.getElementById("foot").textContent=L.foot(place);
  const dt=new Date(Date.UTC(viewDay.y,viewDay.m-1,viewDay.d,12));
  document.getElementById("gDate").textContent=new Intl.DateTimeFormat(L.loc,{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(dt);
  document.getElementById("hDate").textContent=hijriText(viewDay);
  document.getElementById("todayBtn").hidden=sameDay(viewDay,todayInPlace());
  document.getElementById("hijriSel").value=String(hijriOff);
  document.getElementById("lTheme").textContent=L.theme;
  const ts=document.getElementById("themeSel");L.themeOpts.forEach((t,i)=>ts.options[i].textContent=t);ts.value=theme;
  D=derive(viewDay);
  drawRing(viewDay,D);

}

/* ---------- 45-day list ---------- */
const DAYS=45;
function renderList(){
  const L=T[lang],start=todayInPlace();
  const data=[];
  for(let i=0;i<DAYS;i++){const day=addDays(start,i),t=timesFor(day);
    data.push({day,t,len:(t.maghrib-OFFSETS.maghrib)-(t.shuruq-OFFSETS.shuruq)})}

  const tp=timesFor(addDays(start,-1));let prevLen=(tp.maghrib-OFFSETS.maghrib)-(tp.shuruq-OFFSETS.shuruq);
  const wdF=new Intl.DateTimeFormat(L.loc,{weekday:"short",timeZone:"UTC"}), mF=new Intl.DateTimeFormat(L.loc,{month:"long",year:"numeric",timeZone:"UTC"});
  const dt=d=>new Date(Date.UTC(d.y,d.m-1,d.d,12));

  let lastM=null;

       KEYS.map(k=>`<td class="${k==="shuruq"?"sun":""}">${fmt(r.t[k])}</td>`).join("")+
       `<td class="len"><b>${Math.floor(r.len/60)}:${String(Math.round(r.len%60)).padStart(2,"0")}</b><span class="${delta<0?"dn":delta>0?"up":""}">${delta>0?"+":delta<0?"−":"±"}${Math.abs(delta)}</span></td></tr>`;
  });
  document.getElementById("dayTbl").innerHTML=h+"</tbody>";
  // chart
  const svg=document.getElementById("lenChart"),W=360,H=150,pl=40,pr=14,pt2=18,pb=26;
  const lens=data.map(r=>r.len),mn=Math.min(...lens),mx=Math.max(...lens);
  const lo=Math.floor((mn-5)/15)*15,hi=Math.ceil((mx+5)/15)*15;

  const pts=lens.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  g+=`<path class="area" d="M${pts[0]} L${pts.join(" L")} L${X(DAYS-1).toFixed(1)},${H-pb} L${X(0).toFixed(1)},${H-pb}Z"/>`;

  svg.innerHTML=g;
  const tot=Math.round(lens[DAYS-1]-lens[0]);

function tick(){
  if(!D)return;
  const L=T[lang];const n=nowMin();
  if(currentKey()!==ringCur)drawRing(viewDay,D);
  if(!sameDay(n.day,viewDay)){
    // other day in view: no pointer, center shows the day's Fajr–Isha span
    nowRefs.g.setAttribute("visibility","hidden");centerRefs.st2.textContent="";
    centerRefs.cs.textContent=nm("fajr")+" – "+nm("isha");centerRefs.cn.textContent=fmt(D.t.fajr)+" – "+fmt(D.t.isha);
    centerRefs.cn.setAttribute("style","font-size:17px");centerRefs.cc.textContent="";centerRefs.st.textContent="";
    for(const r of document.querySelectorAll(".row"))r.classList.remove("cur","next","active","activem");
    return;
  }
  // after local midnight the view rolls to the new day on its own
  const t=D.t,m=n.min;
  nowRefs.g.setAttribute("visibility","visible");
  const bg=ringCur?R.bulge:0,[x1,y1]=pt(R.outI-bg-1,m),[x2,y2]=pt(R.outO+bg+5,m),[dx,dy]=pt(R.outO+bg+10,m);
  for(const l of [nowRefs.halo,nowRefs.ln]){l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2)}
  nowRefs.dot.setAttribute("cx",dx);nowRefs.dot.setAttribute("cy",dy);
  // next event
  const ev=KEYS.map(k=>[k,t[k]]).filter(([,v])=>v>m);
  let nextK,nextM;
  if(ev.length){[nextK,nextM]=ev[0]}else{nextK="fajr";nextM=D.tn.fajr+1440}
  // current prayer period
  const cur=curPrayer(t,m);
  for(const r of document.querySelectorAll("#prayerRows .row")){r.classList.toggle("cur",r.dataset.k===cur);r.classList.toggle("next",r.dataset.k===nextK)}
  const secs=Math.max(0,Math.round((nextM-m)*60));
  const hh=Math.floor(secs/3600),mm=Math.floor(secs%3600/60),ss=secs%60;
  centerRefs.cs.textContent=L.untilFmt(nm(nextK),fmt(nextM));
  centerRefs.cn.removeAttribute("style");centerRefs.cn.textContent=L.sub[nextK];
  centerRefs.cc.textContent=`${hh}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
  // states
  const inK=D.ker.findIndex(([a,b])=>m>=a&&m<b);
  const nights=[D.lastNight,D.tonight];
  const afterMid=nights.some(x=>m>=x.mid&&m<x.end), inLast=nights.some(x=>m>=x.t2&&m<x.end);
  let state="",col="";
  let state2="";
  if(inK>=0){state=L.stK;col="var(--kerahat)"}else if(inLast){state=L.stT;state2=afterMid?L.stM:"";col="var(--third)"}else if(afterMid){state=L.stM;col="var(--makruh)"}
  centerRefs.st.textContent=state;centerRefs.st.setAttribute("style",`fill:${col||"var(--muted)"}`);
  centerRefs.st2.textContent=state2;centerRefs.st2.setAttribute("style","fill:var(--makruh)");
  document.querySelectorAll("#kerRows .row").forEach((r,i)=>r.classList.toggle("active",i===inK));
  const nr=document.querySelectorAll("#nightRows .row");
  nr.forEach(r=>{r.classList.remove("active","activem");if(r.dataset.kind==="th"&&inLast)r.classList.add("active");if(r.dataset.kind==="mid"&&afterMid)r.classList.add("activem")});
}

/* ---------- Kaza tracker ----------
   One hex digit per day from 01.01.2022 to 31.12.2031, bits: 1 Dhuhr, 2 Asr, 4 Maghrib, 8 Isha.
   The log counts ticks per real (device) date for the projection. Stored data is never reset automatically. */
const KZ_START=Date.UTC(2022,0,1), KZ_DAYS=3652, KZ_FIRST_Y=2022, KZ_LAST_Y=2031;
const KZ_KEYS=["dhuhr","asr","maghrib","isha"], KZ_BIT={dhuhr:1,asr:2,maghrib:4,isha:8};
const KZ_LS={days:"vakit.kaza.days",log:"vakit.kaza.log",bak:"vakit.kaza.backup"};
const POPC=[0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4];
const pad2=n=>String(n).padStart(2,"0");
const kzIdx=(y,m,d)=>Math.round((Date.UTC(y,m-1,d)-KZ_START)/864e5);
const kzDate=i=>{const t=new Date(KZ_START+i*864e5);return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}};
const isoDay=d=>`${d.y}-${pad2(d.m)}-${pad2(d.d)}`;
function deviceToday(){const n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return localStorage.getItem(k)===v}catch(e){return false}}
const kzValidDays=s=>typeof s==="string"&&s.length===KZ_DAYS&&/^[0-9a-f]+$/.test(s);
const kzEncode=a=>Array.from(a,v=>v.toString(16)).join("");
const kzDecode=s=>Uint8Array.from(s,c=>parseInt(c,16));
function kzCleanLog(o){const out={};if(o&&typeof o==="object"&&!Array.isArray(o))
  for(const k in o){const v=o[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&Number.isInteger(v)&&v!==0)out[k]=v}return out}
function kzInitial(){const a=new Uint8Array(KZ_DAYS),last=kzIdx(2026,12,4);
  for(let i=0;i<=last;i++)a[i]=15;a[last+1]=KZ_BIT.dhuhr|KZ_BIT.asr;return a}

let kz=null,kzLog={},kzState="ok"; // ok | nostore (saving fails) | broken (stored data unreadable, left untouched)
function kzLoad(){
  const raw=lsGet(KZ_LS.days);
  if(raw==null){kz=kzInitial();kzState=lsSet(KZ_LS.days,kzEncode(kz))?"ok":"nostore"}
  else if(kzValidDays(raw)){kz=kzDecode(raw);kzState="ok"}
  else{kz=new Uint8Array(KZ_DAYS);kzState="broken"}
  try{kzLog=kzCleanLog(JSON.parse(lsGet(KZ_LS.log)||"{}"))}catch(e){kzLog={}}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
}
function kzSave(){
  if(kzState==="broken")return false;
  const ok=lsSet(KZ_LS.days,kzEncode(kz))&&lsSet(KZ_LS.log,JSON.stringify(kzLog));
  kzState=ok?"ok":"nostore";return ok;
}
function kzCount(a){
  let done=0;const years=[];
  for(let y=KZ_FIRST_Y;y<=KZ_LAST_Y;y++){const i0=kzIdx(y,1,1),i1=kzIdx(y+1,1,1);let d=0;
    for(let i=i0;i<i1;i++)d+=POPC[a[i]];years.push({y,done:d,total:(i1-i0)*4});done+=d}
  return {done,total:KZ_DAYS*4,open:KZ_DAYS*4-done,years};
}
const kzLoc=()=>lang==="tr"?"tr-TR":"de-DE";
const kzN=n=>new Intl.NumberFormat(kzLoc()).format(n);
function kzPct(done,total,dec){let p=total?done/total*100:0;if(done<total)p=Math.min(p,dec?99.9:99);
  const s=new Intl.NumberFormat(kzLoc(),{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(p);return lang==="tr"?"%"+s:s+" %"}
function kzFmtDate(t,opt){return new Intl.DateTimeFormat(T[lang].loc,Object.assign({day:"numeric",month:"long",year:"numeric",timeZone:"UTC"},opt||{})).format(t)}

/* projection: ticks of the last 30 days (or since the first tick, if that is more recent) */
function kzProjection(open){
  if(open===0)return {all:true};
  const td=deviceToday(),t0=Date.UTC(td.y,td.m-1,td.d);
  const days=Object.keys(kzLog).filter(k=>kzLog[k]>0).sort();
  if(days.length<7)return {few:days.length};
  const first=Date.parse(days[0]+"T00:00:00Z");
  const span=Math.max(1,Math.min(30,Math.round((t0-first)/864e5)+1));
  let sum=0;for(let j=0;j<span;j++){const t=new Date(t0-j*864e5);sum+=kzLog[isoDay({y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()})]||0}
  if(sum<=0)return {few:days.length};
  const rate=sum/span;
  return {rate,finish:new Date(t0+Math.ceil(open/rate)*864e5)};
}

function kzDaysSince(iso){const t=Date.parse(iso+"T00:00:00Z");if(isNaN(t))return null;const td=deviceToday();return Math.round((Date.UTC(td.y,td.m-1,td.d)-t)/864e5)}

function renderKaza(){

    kzBakH:K.bak,kzSave:K.save,kzLoad:K.load,kzBakHint:K.bakHint,kzWarnBtn:K.warnBtn,kzWarnS:K.warnSub,kzPrevH:K.prevH,kzPrevWarn:K.prevWarn,

  $("kzWarn").hidden=!warn;

  $("kzBakInfo").textContent=K.bakInfo(since==null?"":kzFmtDate(new Date(Date.parse(bak+"T00:00:00Z"))));
  $("kzSave").disabled=kzState==="broken";
  // summary
  const c=kzCount(kz);
  $("kzDone").textContent=kzN(c.done);$("kzOpen").textContent=kzN(c.open);$("kzPct").textContent=kzPct(c.done,c.total,1);
  $("kzBar").style.width=(c.done/c.total*100)+"%";
  $("kzYears").innerHTML=c.years.map(y=>`<div class="kz-yr"><span>${y.y}</span><div class="bar"><i style="width:${(y.done/y.total*100).toFixed(2)}%"></i></div><em>${kzPct(y.done,y.total,0)}</em></div>`).join("");
  const pr=kzProjection(c.open),nf1=new Intl.NumberFormat(kzLoc(),{minimumFractionDigits:1,maximumFractionDigits:1});
  $("kzProj").innerHTML=`<small>${K.projH}</small>`+(pr.all?K.all:pr.few!=null?K.few(pr.few):K.proj(nf1.format(pr.rate),kzFmtDate(pr.finish)));
  kzRenderCal();
  if(kzOpenDay>=0)kzRenderSheet();
  if(kzPending)kzShowPreview(false);
  kzShowMsg();
}

function kzRenderCal(){

  $("kzY").textContent=kzY;

/* bottom sheet for one day */
function kzRenderSheet(){
  const L=T[lang],K=L.kz,i=kzOpenDay,v=kz[i],d=kzDate(i),$=id=>document.getElementById(id);

/* backup */
let kzMsg=null; // key into T[lang].kz, re-translated on language switch
function kzBakMsg(key,err){kzMsg=key?{key,err:!!err}:null;kzShowMsg()}
function kzShowMsg(){const e=document.getElementById("kzBakMsg");e.hidden=!kzMsg;e.textContent=kzMsg?T[lang].kz[kzMsg.key]:"";e.classList.toggle("err",!!(kzMsg&&kzMsg.err))}
function kzMarkBackup(){lsSet(KZ_LS.bak,isoDay(deviceToday()))}
async function kzExport(){
  const K=T[lang].kz;if(kzState==="broken")return;
  const name=`vakit-kaza-${isoDay(deviceToday())}.json`;
  const data={app:"Vakit Ring",type:"kaza",version:1,created:new Date().toISOString(),start:"2022-01-01",end:"2031-12-31",
    prayers:KZ_KEYS,encoding:"one hex digit per day; 1 dhuhr, 2 asr, 4 maghrib, 8 isha",days:kzEncode(kz),log:kzLog};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  let file=null;try{file=new File([blob],name,{type:"application/json"})}catch(e){}
  const done=()=>{kzMarkBackup();kzBakMsg("saved",false);renderKaza()};
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});done();return}
    catch(e){if(e&&e.name==="AbortError"){kzBakMsg("cancelled",false);return}}
  }
  try{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);done()}catch(e){kzBakMsg("saveErr",true)}
}
let kzPending=null;
function kzReadFile(f){
  const K=T[lang].kz;kzBakMsg(null);kzPending=null;document.getElementById("kzPrev").hidden=true;
  if(!f)return;if(f.size>2e6){kzBakMsg("bad",true);return}
  const r=new FileReader();
  r.onload=()=>{let o=null;try{o=JSON.parse(String(r.result))}catch(e){}
    if(!o||o.type!=="kaza"||o.start!=="2022-01-01"||!kzValidDays(o.days)){kzBakMsg("bad",true);return}
    kzPending={days:kzDecode(o.days),log:kzCleanLog(o.log),created:Date.parse(o.created)};kzShowPreview(true)};
  r.onerror=()=>kzBakMsg("bad",true);
  r.readAsText(f);
}
function kzShowPreview(scroll){
  if(!kzPending)return;
  const K=T[lang].kz,f=kzCount(kzPending.days),c=kzCount(kz);
  const dt=isNaN(kzPending.created)?K.unknown:new Intl.DateTimeFormat(T[lang].loc,{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(kzPending.created));
  document.getElementById("kzPrevFile").innerHTML=K.prevFile(dt,kzN(f.done),kzN(f.open),kzPct(f.done,f.total,1));
  document.getElementById("kzPrevNow").innerHTML=K.prevNow(kzN(c.done),kzN(c.open),kzPct(c.done,c.total,1));
  const box=document.getElementById("kzPrev");box.hidden=false;if(scroll)box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function kzApplyPending(){
  if(!kzPending)return;const K=T[lang].kz;
  kz=kzPending.days;kzLog=kzPending.log;kzPending=null;kzState="ok";
  const ok=kzSave();document.getElementById("kzPrev").hidden=true;
  kzBakMsg(ok?"loaded":"saveErr",!ok);kzJumpToOpen();renderKaza();kzMainButton();
}

 {id:"kunut2",vitr:true,n:{de:"Kunut 2",tr:"Kunut 2"},ar:"اللَّهُمَّ إِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ وَإِلَيْكَ نَسْعَى وَنَحْفِدُ نَرْجُو رَحْمَتَكَ وَنَخْشَى عَذَابَكَ إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ",
  tl:"Allahumma iyyaka na'budu wa laka nusalli wa nasdschud, wa ilayka nas'a wa nahfid, nardschu rahmataka wa nakhscha adhabak, inna adhabaka bil-kuffari mulhiq.",
  de:"O Allah, Dir allein dienen wir, für Dich beten wir und werfen uns nieder. Zu Dir eilen wir und dienen Dir eifrig. Wir hoffen auf Deine Barmherzigkeit und fürchten Deine Strafe. Deine Strafe trifft gewiss die Ungläubigen.",
  tr:"Allah'ım! Yalnız sana ibadet eder, senin için namaz kılar ve secde ederiz. Sana koşar, sana yaklaştıracak işleri yaparız. Rahmetini umar, azabından korkarız. Şüphesiz senin azabın kafirlere ulaşacaktır."}
];
const gEsc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gTl=s=>lang==="tr"?s.replace(/dsch/g,"c").replace(/Dsch/g,"C").replace(/sch/g,"ş").replace(/Sch/g,"Ş"):s;
function gPartName(k,p){const G=GT[lang];const pn=(lang==="tr"&&k==="fajr")?"Sabah":nm(k);
  if(p.kind==="vitr")return G.part.vitr;
  if(p.kind==="fard")return lang==="tr"?`${pn} farzı`:`${G.part.fard} von ${pn}`;
  return lang==="tr"?`${pn} namazının ${G[p.pos]} sünneti`:`${G.part.sunna} ${G[p.pos]} ${pn}`}
function gSteps(k,p){const S=GT[lang].step,out=[];
  const fard=p.kind==="fard",sg=p.st==="sg";
  out.push(S.niyya+gPartName(k,p));out.push(S.takbir);
  for(let r=1;r<=p.n;r++){
    const rd=[];
    if(r===1||(r===3&&sg))rd.push(S.subh,S.audhu);
    rd.push(S.basm,S.fat);
    if(!fard||r<=2)rd.push(S.sure);
    if(r===3&&p.kind==="vitr")rd.push(S.kunut);
    out.push(`<b>${r}. ${S.r}:</b> ${rd.join(", ")} · ${S.ruku} · ${S.rise} · ${S.sajda}`);
    if(r===2&&p.n>2)out.push(`<b>${S.sit1}</b>${sg?S.sitSg:S.sitTah}`);
  }
  out.push(`<b>${S.sitL.split(":")[0]}:</b>${S.sitL.split(":").slice(1).join(":")}`);out.push(S.salam);
  return out}
function gOpen(k){const G=GT[lang],t=D&&D.t;
  const head=document.getElementById("gHead");
  head.innerHTML=`<span class="g-ar" lang="ar">${AR[k]}</span><span class="g-hd"><h3 id="gTitle">${gEsc(nm(k))}${t?` <span class="g-tm">${fmt(t[k])}</span>`:""}</h3><p class="shsub">${G.hanafi}</p></span>`;
  const body=document.getElementById("gBody");
  if(k==="shuruq"){body.innerHTML=`<p class="g-note">${G.noPrayer}</p><ul class="g-pts"><li>${G.pts.shuruq1}</li><li>${G.pts.shuruq2}</li></ul>`}
  else{
    const parts=GP[k];
    const summary=parts.map(p=>`<span class="g-chip g-${p.st}">${p.n} ${p.kind==="vitr"?G.part.vitr:p.kind==="fard"?G.part.fard:G.part.sunna}</span>`).join('<span class="g-dot">·</span>');
    let h=`<div class="g-sum">${summary}</div>`;
    parts.forEach(p=>{
      h+=`<section class="g-part"><div class="g-ph"><b>${gEsc(gPartName(k,p))}</b><span class="g-badge g-${p.st}">${p.n} ${G.rak} · ${G.st[p.st]}</span></div>`+
         `<ul class="g-pts">${p.pts.map(x=>`<li>${G.pts[x]}</li>`).join("")}</ul>`+
         `<details class="g-det"><summary>${G.steps}</summary><ol>${gSteps(k,p).map(s=>`<li>${s}</li>`).join("")}</ol></details></section>`});
    const texts=GTX.filter(x=>!x.vitr||k==="isha");
    h+=`<details class="g-det g-texts"><summary>${G.texts}</summary>${texts.map(x=>`<div class="g-tx"><b>${x.n[lang]}</b><p class="g-arx" lang="ar" dir="rtl">${x.ar}</p><p class="g-tl">${gEsc(gTl(x.tl))}</p><p class="g-mn">${gEsc(x[lang])}</p></div>`).join("")}</details>`;
    body.innerHTML=h}
  document.getElementById("gClose").textContent=G.close;
  document.getElementById("gSheetBg").hidden=false;const sh=document.getElementById("gSheet");sh.hidden=false;body.scrollTop=0;
  document.getElementById("gClose").focus({preventScroll:true});
}
function gCloseSheet(){document.getElementById("gSheetBg").hidden=true;document.getElementById("gSheet").hidden=true}
document.getElementById("prayerRows").addEventListener("click",e=>{const r=e.target.closest(".row[data-k]");if(r)gOpen(r.dataset.k)});
document.getElementById("prayerRows").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const r=e.target.closest(".row[data-k]");if(r){e.preventDefault();gOpen(r.dataset.k)}});
document.getElementById("gSheetBg").onclick=gCloseSheet;
document.getElementById("gClose").onclick=gCloseSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("gSheet").hidden)gCloseSheet()});

applyTheme();
kzLoad();
fillCities();
viewDay=todayInPlace();lastDay=viewDay;
render();
if(location.hash==="#tage")showList(true);
if(location.hash==="#kaza")showView("kaza");
if(STANDALONE){document.getElementById("placeCard").hidden=true;locate(true)}
})();
</script>
